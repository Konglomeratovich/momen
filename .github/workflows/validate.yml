name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ash syntax
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            alpine:3.22 ash -c '
              for file in \
                /work/install.sh \
                /work/migrate-podkop-to-forkop.sh \
                /work/tests/test-migrate-podkop-to-forkop.sh \
                /work/tests/test-upstream-forkop-migration.sh; do
                  ash -n "$file" || exit 1
              done
            '

      - name: Check shell scripts with ShellCheck
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            koalaman/shellcheck:v0.11.0 \
              /work/migrate-podkop-to-forkop.sh \
              /work/tests/test-migrate-podkop-to-forkop.sh \
              /work/tests/test-upstream-forkop-migration.sh

      - name: Test Podkop to Forkop orchestration
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            alpine:3.22 ash /work/tests/test-migrate-podkop-to-forkop.sh

      - name: Test pinned upstream Forkop migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-assets
          curl --fail --location --retry 3 \
            --output .test-assets/forkop_1.0.5.apk \
            https://github.com/ushan0v/forkop/releases/download/1.0.5/forkop_1.0.5.apk
          echo '8d514180b3e27c73179c021f1a659b23aaf765003f9810659f7ad1ca34152439  .test-assets/forkop_1.0.5.apk' \
            | sha256sum --check --strict
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            openwrt/rootfs:x86_64-25.12.2 \
            ash /work/tests/test-upstream-forkop-migration.sh /work/.test-assets/forkop_1.0.5.apk

      - name: Simulate PPTP support installation on OpenWrt
        run: |
          docker run --rm openwrt/rootfs:x86_64-25.12.2 ash -c '
            set -eu
            packages="kmod-gre kmod-pptp ppp-mod-pptp kmod-nf-nathelper kmod-nf-nathelper-extra tcpdump"
            apk update >/dev/null
            apk add --simulate $packages >/dev/null
          '

      - name: Verify pinned catalog
        shell: bash
        run: |
          set -euo pipefail
          expected_hash="$(sed -n "s/^catalog_sha256='\([^']*\)'/\1/p" install.sh)"
          expected_count="$(sed -n "s/^catalog_expected_count='\([^']*\)'/\1/p" install.sh)"
          actual_hash="$(sha256sum assets/r1.gz | awk '{print $1}')"
          actual_count="$(gzip -dc assets/r1.gz | sed '/^[[:space:]]*$/d' | wc -l | tr -d '[:space:]')"
          test "$actual_hash" = "$expected_hash"
          test "$actual_count" = "$expected_count"
          test "$actual_count" = '724'

      - name: Verify safety controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OpenWrt 24.10 or newer is required' install.sh
          grep -q 'OPENWRT_COMPATIBILITY_ID=' install.sh
          grep -q 'RETAINED_FREE_RESERVE_KB=' install.sh
          grep -q 'retained_reserve_kb=12288' install.sh
          grep -q 'supported Podkop versions are 0.7.0 through 0.7.22' install.sh
          grep -q 'ROLLBACK_COMPLETED=true' install.sh
          grep -q 'POSTCHECKS_PASSED=true' install.sh
          grep -q 'DIRECT_TEXT_DOMAIN_COUNT=' install.sh
          grep -q 'DIRECT_TLD_DOMAIN_COUNT=' install.sh
          grep -q 'momen-r1-cyrillic-tlds.lst' install.sh
          ! grep -q '^outside_domains=' install.sh
